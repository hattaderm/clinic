uted);font-size:13px} .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px} .dow{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.12em;padding:8px 0} .day{min-height:132px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px} .day.closed{background:#f2eee8;color:#aaa} .date{font-weight:700;display:flex;justify-content:space-between;align-items:center} .date small{font-size:11px;color:var(--muted)} .slots{display:flex;flex-wrap:wrap;gap:6px} .slot{border:1px solid #d9ceb9;background:#fbf7ef;border-radius:999px;padding:4px 8px;font-size:12px;cursor:pointer} .slot:hover,.slot.selected{background:var(--navy);border-color:var(--navy);color:#fff} .slot.full{background:#eee;color:#aaa;border-color:#ddd;cursor:not-allowed;text-decoration:line-through} .form-card{padding:26px;position:sticky;top:104px} .selected-box{border-radius:18px;background:var(--soft);border:1px solid var(--line);padding:16px;margin-bottom:20px} .selected-box b{font-size:18px} label{display:block;font-weight:700;margin:14px 0 6px} input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;font:inherit} textarea{min-height:92px;resize:vertical} .form-actions{display:grid;gap:10px;margin-top:20px} .notice{font-size:12px;color:var(--muted);margin-top:12px} .admin{margin-top:18px;border-top:1px solid var(--line);padding-top:18px} .admin details{font-size:13px;color:var(--muted)} .admin button{margin-top:10px} .list{margin-top:14px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff} .list-item{padding:10px 12px;border-bottom:1px solid #eee;font-size:13px} .footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:12px} @media(max-width:980px){.layout{grid-template-columns:1fr}.form-card{position:static}.calendar{grid-template-columns:1fr}.dow{display:none}.day{min-height:auto}.header- <section class="hero"><div class="container"><span class="pill">ONLINE RESERVATION</span><h1>WEB予約</h1><p class="lead">先3週間分のカレンダーから予約日時を選択してください。診療内容を入力して「予約内容を保存」を押すと、この端末のブラウザ内に予約データが保存されます。</p></div></section>
<section class="container layout">
  <div class="card calendar-card"><div class="toolbar"><div><h2>予約カレンダー</h2><div class="month-note" id="rangeNote"></div></div><button class="btn btn-outline" onclick="clearSelection()">選択解除</button></div><div class="calendar" id="calendar"></div></div>
  <aside class="card form-card"><div class="selected-box"><div>選択中の日時</div><b id="selectedText">未選択</b></div><form id="reserveForm"><input type="hidden" id="date"><input type="hidden" id="time"><label>診療区分</label><select id="department" required><option value="">選択してください</option><option>皮膚科・内科</option><option>美容皮膚科</option><option>美容外科</option></select><label>お名前</label><input id="name" autocomplete="name" required placeholder="例：八田 太郎"><label>電話番号</label><input id="tel" autocomplete="tel" required placeholder="例：090-0000-0000"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="例：sample@example.com"><label>症状・相談内容</label><textarea id="memo" placeholder="例：湿疹、にきび、発熱、高血圧、シミ、肝斑、AGA・女性型AGA、二重整形・目元整形、クマ・たるみ・シワ、痩身・ダイエット・脂肪吸引、男性機能相談など"></textarea><div class="form-actions"><button class="btn btn-primary" type="submit">予約内容を保存</button><button class="btn btn-outline" type="button" onclick="downloadCsv()">予約一覧CSVをダウンロード</button></div><p class="notice">※このHTMLだけでは医院側サーバーへ自動送信されません。実運用ではサーバー、Googleフォーム、予約システム等への接続が必要です。</p></form><div class="admin"><details><summary>この端末に保存された予約一覧を表示</summary><div class="list" id="bookingList"></div><button class="btn btn-outline" onclick="localStorage.removeItem(STORE_KEY); renderBookings(); renderCalendar();">この端末の予約データを消去</button></details></div></aside>

<script>
const STORE_KEY='hatta_reservations_v1';
const DOW=['日','月','火','水','木','金','土'];
const slotSets={am:['10:00','10:30','11:00','11:30','12:00','12:30'],pm:['15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30']};
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function jpDate(s){const d=new Date(s+'T00:00:00'); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`}
function getBookings(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return []}}
function saveBookings(rows){localStorage.setItem(STORE_KEY,JSON.stringify(rows))}
function slotsForDate(d){const w=d.getDay(); if(w===0) return []; if(w===3 || w===6) return slotSets.am; return [...slotSets.am,...slotSets.pm];}
function isBooked(date,time){return getBookings().some(b=>b.date===date && b.time===time)}
function renderCalendar(){const cal=document.getElementById('calendar'); cal.innerHTML=''; DOW.forEach(x=>{const el=document.createElement('div');el.className='dow';el.textContent=x;cal.appendChild(el)}); const today=new Date(); today.setHours(0,0,0,0); const end=new Date(today); end.setDate(today.getDate()+20); document.getElementById('rangeNote').textContent=`${jpDate(fmt(today))}〜${jpDate(fmt(end))}`; for(let i=0;i<21;i++){const d=new Date(today); d.setDate(today.getDate()+i); const date=fmt(d); const day=document.createElement('div'); const slots=slotsForDate(d); day.className='day'+(slots.length?'':' closed'); day.innerHTML=`<div class="date"><span>${d.getMonth()+1}/${d.getDate()}</span><small>${DOW[d.getDay()]}</small></div>`; const box=document.createElement('div'); box.className='slots'; if(!slots.length){box.textContent='休診';} else {slots.forEach(t=>{const btn=document.createElement('button'); btn.type='button'; btn.className='slot'+(isBooked(date,t)?' full':''); btn.textContent=t; if(!isBooked(date,t)) btn.onclick=()=>selectSlot(date,t,btn); box.appendChild(btn);})} day.appendChild(box); cal.appendChild(day);}}
function selectSlot(date,time,btn){document.querySelectorAll('.slot.selected').forEach(x=>x.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('date').value=date; document.getElementById('time').value=time; document.getElementById('selectedText').textContent=jpDate(date)+' '+time;}
function clearSelection(){document.querySelectorAll('.slot.selected').forEach(x=>x.classList.remove('selected')); document.getElementById('date').value=''; document.getElementById('time').value=''; document.getElementById('selectedText').textContent='未選択';}
document.getElementById('reserveForm').addEventListener('submit',e=>{e.preventDefault(); const date=document.getElementById('date').value; const time=document.getElementById('time').value; if(!date||!time){alert('カレンダーから予約日時を選択してください。'); return;} if(isBooked(date,time)){alert('この枠はすでに保存されています。別の時間を選んでください。'); renderCalendar(); return;} const row={createdAt:new Date().toISOString(),date,time,department:department.value,name:name.value,tel:tel.value,email:email.value,memo:memo.value,status:'予約'}; const rows=getBookings(); rows.push(row); rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); saveBookings(rows); alert('予約内容を保存しました。'); e.target.reset(); clearSelection(); renderBookings(); renderCalendar();});
function renderBookings(){const box=document.getElementById('bookingList'); const rows=getBookings(); if(!rows.length){box.innerHTML='<div class="list-item">保存された予約はありません。</div>';return} box.innerHTML=rows.map(b=>`<div class="list-item"><b>${jpDate(b.date)} ${b.time}</b><br>${b.department} / ${b.name} / ${b.tel}<br>${b.memo||''}</div>`).join('');}
function downloadCsv(){const rows=getBookings(); const header=['作成日時','予約日','予約時間','診療区分','氏名','電話','メール','メモ','ステータス']; const data=[header,...rows.map(b=>[b.createdAt,b.date,b.time,b.department,b.name,b.tel,b.email,b.memo,b.status])]; const csv=data.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('
'); const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hatta_reservations.csv'; a.click(); URL.revokeObjectURL(a.href);}
renderCalendar(); renderBookings();
</script>
